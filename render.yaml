services:
  - type: web
    name: salim-sauki-data-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 bot:app_web
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TELEGRAM_POLLING_ENABLED
        value: "false"
      - key: CLEANUP_POLLING_ENABLED
        value: "false"

  - type: worker
    name: salim-sauki-data-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TELEGRAM_POLLING_ENABLED
        value: "true"
      - key: CLEANUP_POLLING_ENABLED
        value: "false"
